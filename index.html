<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dataria.ai</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="profile">
  <header class="profile-header">
    <div class="header-top">
      <img class="avatar" src="assets/header/profile-logo.png" alt="Foto de perfil de dataria.ai">
      <div class="header-info">
        <div class="username-row">
          <h1 class="username">dataria.ai</h1>
          <button class="icon-btn more-btn" aria-label="Más opciones" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
              <circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </div>

        <div class="stats-row">
          <span><strong id="stat-posts">0</strong> publicaciones</span>
          <span><strong>1</strong> seguidor</span>
          <span><strong>0</strong> seguidos</span>
        </div>

        <div class="followed-by">
          <img class="followed-by-avatar" src="assets/header/follower-avatar.png" alt="">
          <span>Le sigue <strong>felipoteeeee</strong></span>
        </div>
      </div>
    </div>

    <button class="follow-btn" type="button">Seguir</button>

    <nav class="tabs">
      <button class="tab active" aria-label="Publicaciones" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="5" height="5" rx="1"/>
          <rect x="9.5" y="3" width="5" height="5" rx="1"/>
          <rect x="16" y="3" width="5" height="5" rx="1"/>
          <rect x="3" y="9.5" width="5" height="5" rx="1"/>
          <rect x="9.5" y="9.5" width="5" height="5" rx="1"/>
          <rect x="16" y="9.5" width="5" height="5" rx="1"/>
          <rect x="3" y="16" width="5" height="5" rx="1"/>
          <rect x="9.5" y="16" width="5" height="5" rx="1"/>
          <rect x="16" y="16" width="5" height="5" rx="1"/>
        </svg>
      </button>
      <button class="tab" aria-label="Publicaciones etiquetadas" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 4h16v16H4z" rx="2"/>
          <circle cx="12" cy="10" r="3"/>
          <path d="M6 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/>
        </svg>
      </button>
    </nav>
  </header>

  <main class="grid" id="grid"></main>
</div>

<div class="modal-overlay" id="modal" hidden>
  <button class="modal-close" id="modalClose" aria-label="Cerrar" type="button">&times;</button>
  <div class="modal-content" id="modalContent"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
